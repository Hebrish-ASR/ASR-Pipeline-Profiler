<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#14806e"/>
      <stop offset="1" stop-color="#0b5448"/>
    </linearGradient>
  </defs>
  <rect x="4" y="4" width="120" height="120" rx="26" fill="url(#bg)"/>
  <!-- waveform in -->
  <g stroke="#d8efe7" stroke-width="5" stroke-linecap="round">
    <line x1="20" y1="44" x2="20" y2="52"/>
    <line x1="29" y1="36" x2="29" y2="60"/>
    <line x1="38" y1="41" x2="38" y2="55"/>
  </g>
  <!-- three stages with junctions between -->
  <rect x="48" y="38" width="18" height="20" rx="4" fill="#ffffff"/>
  <rect x="72" y="38" width="26" height="20" rx="4" fill="#ffffff"/>
  <rect x="104" y="38" width="10" height="20" rx="3" fill="#ffffff"/>
  <rect x="67.5" y="33" width="3" height="30" rx="1.5" fill="#ff5a4e"/>
  <rect x="99.5" y="33" width="3" height="30" rx="1.5" fill="#ff5a4e"/>
  <!-- CPU trace -->
  <path d="M18 100 H44 L50 76 L56 100 H74 L80 82 L86 100 H110" fill="none"
        stroke="#e0b14a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
